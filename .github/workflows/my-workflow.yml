name: My first workflow
on: [push,workflow_dispatch]
jobs:
  my-first-job: #job name
    runs-on: ubuntu-latest
    steps:
      - name: List files
        run: ls -a
      - name: Print Working Directory
        run: pwd
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: List all files
        run: ls -a
        
